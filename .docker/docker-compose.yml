services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  php:
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
      target: runtime
      args:
        TIMEZONE: ${TIMEZONE}
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge

  scheduler:
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
      target: scheduler
      args:
        TIMEZONE: ${TIMEZONE:-UTC}
    command: ["cron", "-f"]
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/scheduler-entrypoint.sh"]
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
  edge:
    name: portfolio_edge
    external: true
