name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_CACHE_DIR: /tmp/composer-cache

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: |
          apt-get update
          apt-get install -y git unzip curl libpq-dev
          docker-php-ext-install pdo_pgsql
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  unit-tests:
    name: Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: |
          apt-get update
          apt-get install -y git unzip curl libpq-dev
          docker-php-ext-install pdo_pgsql
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: APP_ENV=test php bin/phpunit --testsuite unit --no-coverage

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app_db_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_SECRET: test-secret
      DATABASE_NAME: app_db_test
      TEST_DATABASE_NAME: app_db_test
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      DATABASE_SERVER_VERSION: "18"
      DATABASE_CHARSET: UTF8
      DATABASE_DRIVER: pdo_pgsql
      GITHUB_BASE_URI: https://api.github.com
      GITHUB_USERNAME: test-username
      LOCK_DSN: flock
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: |
          apt-get update
          apt-get install -y git unzip curl libpq-dev
          docker-php-ext-install pdo_pgsql
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --prefer-dist --no-progress

      - name: Clear test cache
        run: php bin/console cache:clear --env=test

      - name: Create test runtime directories
        run: mkdir -p var/log/test var/cache/test

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists --no-interaction

      - name: Run Doctrine migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run integration tests
        run: php bin/phpunit --testsuite integration --no-coverage

  functional-tests:
    name: Functional Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app_db_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_SECRET: test-secret
      DATABASE_NAME: app_db_test
      TEST_DATABASE_NAME: app_db_test
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      DATABASE_SERVER_VERSION: "18"
      DATABASE_CHARSET: UTF8
      DATABASE_DRIVER: pdo_pgsql
      GITHUB_BASE_URI: https://api.github.com
      GITHUB_USERNAME: test-username
      LOCK_DSN: flock
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: |
          apt-get update
          apt-get install -y git unzip curl libpq-dev
          docker-php-ext-install pdo_pgsql
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --prefer-dist --no-progress

      - name: Clear test cache
        run: php bin/console cache:clear --env=test

      - name: Create test runtime directories
        run: mkdir -p var/log/test var/cache/test

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists --no-interaction

      - name: Run Doctrine migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run functional tests
        run: php bin/phpunit --testsuite functional --no-coverage

  publish:
    name: Publish latest image to GHCR
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - functional-tests
    permissions:
      contents: read
      packages: write
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push latest image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/php/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          build-args: |
            TIMEZONE=Europe/Madrid
