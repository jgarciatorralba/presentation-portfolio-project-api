services:
  php:
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
      target: runtime
      args:
        TIMEZONE: 'Europe/Madrid'
    restart: unless-stopped
    env_file:
      - ../.env.prod
    networks:
      - backend
      - edge

  scheduler:
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
      target: scheduler
      args:
        TIMEZONE: 'Europe/Madrid'
    command: ["cron", "-f"]
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/scheduler-entrypoint.sh"]
    env_file:
      - ../.env.prod
    networks:
      - backend

networks:
  backend:
  edge:
    name: portfolio_edge
    external: true
